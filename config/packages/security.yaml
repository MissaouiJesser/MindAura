security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN:       [ROLE_USER, ROLE_PATIENT, ROLE_PSYCHOLOGUE, ROLE_COACH]
        ROLE_PSYCHOLOGUE: [ROLE_USER]
        ROLE_COACH:       [ROLE_USER]
        ROLE_PATIENT:     [ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateurs
                property: emailUtilisateur

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: form_login

            # ── Authentification classique (formulaire) ──────────────────────
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                default_target_path: app_home
                enable_csrf: true

            # ── OAuth2 — Authenticators Google & GitHub ──────────────────────
            custom_authenticators:
                - App\Security\GoogleAuthenticator
                - App\Security\GithubAuthenticator

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800   # 7 jours
                remember_me_parameter: _remember_me

            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/$,                           roles: PUBLIC_ACCESS }
        - { path: ^/register/verify-pending,     roles: PUBLIC_ACCESS }
        - { path: ^/verify-email,                roles: PUBLIC_ACCESS }
        - { path: ^/login,                       roles: PUBLIC_ACCESS }
        - { path: ^/register,                    roles: PUBLIC_ACCESS }
        - { path: ^/2fa/setup,                   roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password,             roles: PUBLIC_ACCESS }
        - { path: ^/reset-password,              roles: PUBLIC_ACCESS }
        # ── OAuth routes — publiques ────────────────────────────────────────
        - { path: ^/oauth/connect,               roles: PUBLIC_ACCESS }
        - { path: ^/oauth/check,                 roles: PUBLIC_ACCESS }
        - { path: ^/face-verify-credentials, roles: PUBLIC_ACCESS }
        - { path: ^/face-save-photo,         roles: PUBLIC_ACCESS }
        - { path: ^/admin/ressources/api/,  roles: PUBLIC_ACCESS }
        # ── Tout le reste requiert ROLE_USER ────────────────────────────────
        - { path: ^/,                            roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        
